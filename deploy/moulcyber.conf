server {
    listen 443 ssl;
    server_name moulcyber.duckdns.org;

    access_log /var/log/nginx/moulcyber.access.log;
    error_log /var/log/nginx/moulcyber.error.log;

    ssl_certificate /etc/letsencrypt/live/moulcyber.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moulcyber.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:7331;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name moulcyber.duckdns.org;
    return 301 https://$host$request_uri;
}
