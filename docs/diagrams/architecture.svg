<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Khadamati runtime architecture</title>
  <desc id="desc">Twilio routes a phone call to LiveKit, Gemini Live, legal master agent, mini agents, legal knowledge graph, MCP tools, backend APIs, and audit logs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#111827}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#4b5563}
      .edge{stroke:#1f2937;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#6b7280;stroke-width:2;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#374151}
    </style>
  </defs>
  <rect width="1440" height="720" rx="28" fill="#f8fafc"/>
  <text x="56" y="56" class="label" font-size="30">Khadamati Phone-to-Legal-KG Architecture</text>
  <text x="56" y="84" class="sub">Low-latency voice path with A2A orchestration, MCP tools, legal knowledge graph retrieval, and consent-gated execution.</text>

  <g transform="translate(56,140)">
    <rect width="160" height="72" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/>
    <text x="80" y="31" text-anchor="middle" class="label">Caller</text>
    <text x="80" y="53" text-anchor="middle" class="sub">PSTN phone</text>
  </g>
  <g transform="translate(266,140)">
    <rect width="178" height="72" rx="10" fill="#fef2f2" stroke="#c1272d" stroke-width="2"/>
    <text x="89" y="31" text-anchor="middle" class="label">Twilio</text>
    <text x="89" y="53" text-anchor="middle" class="sub">Elastic SIP trunk</text>
  </g>
  <g transform="translate(494,140)">
    <rect width="180" height="72" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="90" y="31" text-anchor="middle" class="label">LiveKit SIP</text>
    <text x="90" y="53" text-anchor="middle" class="sub">inbound room</text>
  </g>
  <g transform="translate(724,140)">
    <rect width="190" height="72" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="95" y="31" text-anchor="middle" class="label">Khadamati</text>
    <text x="95" y="53" text-anchor="middle" class="sub">LiveKit worker</text>
  </g>
  <g transform="translate(724,34)">
    <rect width="190" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="95" y="31" text-anchor="middle" class="label">Gemini Live</text>
    <text x="95" y="53" text-anchor="middle" class="sub">realtime voice</text>
  </g>
  <g transform="translate(964,140)">
    <rect width="184" height="72" rx="10" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="92" y="31" text-anchor="middle" class="label">Legal master</text>
    <text x="92" y="53" text-anchor="middle" class="sub">A2A router</text>
  </g>
  <g transform="translate(1198,140)">
    <rect width="190" height="72" rx="10" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="95" y="31" text-anchor="middle" class="label">Mini-agents</text>
    <text x="95" y="53" text-anchor="middle" class="sub">family, criminal, civil</text>
  </g>
  <g transform="translate(1198,282)">
    <rect width="190" height="76" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="95" y="31" text-anchor="middle" class="label">Legal KG</text>
    <text x="95" y="54" text-anchor="middle" class="sub">articles + chunks</text>
  </g>
  <g transform="translate(964,282)">
    <rect width="184" height="76" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="92" y="31" text-anchor="middle" class="label">MCP tools</text>
    <text x="92" y="54" text-anchor="middle" class="sub">approval + execution</text>
  </g>
  <g transform="translate(964,432)">
    <rect width="184" height="76" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="92" y="31" text-anchor="middle" class="label">Execution</text>
    <text x="92" y="54" text-anchor="middle" class="sub">mock Chikaya</text>
  </g>
  <g transform="translate(494,432)">
    <rect width="180" height="76" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="90" y="31" text-anchor="middle" class="label">FastAPI</text>
    <text x="90" y="54" text-anchor="middle" class="sub">hotline backend</text>
  </g>
  <g transform="translate(494,574)">
    <rect width="180" height="76" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="90" y="31" text-anchor="middle" class="label">Audit logs</text>
    <text x="90" y="54" text-anchor="middle" class="sub">analytics JSONL</text>
  </g>

  <path class="edge" d="M216 176 H266"/>
  <path class="edge" d="M444 176 H494"/>
  <path class="edge" d="M674 176 H724"/>
  <path class="edge" d="M819 140 V106"/>
  <path class="edge" d="M914 176 H964"/>
  <path class="edge" d="M1148 176 H1198"/>
  <path class="edge" d="M1293 212 V282"/>
  <path class="edge" d="M1056 212 V282"/>
  <path class="edge" d="M1056 358 V432"/>
  <path class="dash" d="M724 190 C650 260 610 350 584 432"/>
  <path class="dash" d="M674 470 H964"/>
  <path class="edge" d="M584 508 V574"/>
  <text x="232" y="166" class="small">call</text>
  <text x="455" y="166" class="small">SIP</text>
  <text x="684" y="166" class="small">dispatch</text>
  <text x="922" y="166" class="small">tools</text>
  <text x="1160" y="166" class="small">route</text>
  <text x="1304" y="252" class="small">retrieve</text>
</svg>
